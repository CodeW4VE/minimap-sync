name: build
on:
  push:
    branches: ['*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - run: python3 tools/multiversion.py
      - uses: actions/upload-artifact@v4
        with:
          name: minimapsync
          path: build/multiversion/*.jar
